name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: PennsKit tests
        run: swift test --package-path Packages/PennsKit

      # Unsigned builds: no Team ID in CI (Config/Local.xcconfig is not committed).
      - name: Build Mac app and widget
        run: >
          xcodebuild build -project Penns.xcodeproj -scheme Penns
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build iOS app with watch app and extensions
        run: >
          xcodebuild build -project Penns.xcodeproj -scheme PennsiOS
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO -quiet
